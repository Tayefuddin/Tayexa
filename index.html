    <!-- Above-the-fold font preloads. Inter 400/600 are the two weights used
         in the Hero (eyebrow + body copy + CTA); Zodiak Bold covers the H1.
         crossorigin is required on font preloads even for same-origin
         requests, or the browser fetches the file twice. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/inter/inter-400.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/inter/inter-600.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/zodiak/Zodiak-Bold.woff2" crossorigin />
